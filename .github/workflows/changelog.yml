name: Changelog

# Docs freshness test D: a PR that changes what the registry
# ships must say so under CHANGELOG.md's [Unreleased]. Label the PR
# `skip-changelog` for a change no consumer can observe.
#
# Its own workflow so that adding or removing that label re-runs only this
# check, not the whole build and e2e suite.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    # Dependabot is exempt by name, not only by the label its config applies:
    # the label has to exist in the repository first, and when it did not,
    # every dependency bump failed here.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: CHANGELOG records shipped changes
        run: node scripts/check-changelog.mjs "origin/${{ github.base_ref }}"
